name: SDK

# Builds + tests the TypeScript client against a real `dig serve` daemon.
# Runs when the SDK or the dig source it drives changes.

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "clients/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

jobs:
  typescript:
    name: typescript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: Build dig
        run: go build -o "$RUNNER_TEMP/dig" ./cmd/dig
        working-directory: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: clients/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test against a real dig serve
        run: pnpm test
        env:
          DIG_BIN: ${{ runner.temp }}/dig
      # The ./ai entry declares peer `ai >=4 <6`; the devDependency is ai 5, so prove ai 4 too.
      - name: Typecheck and test against ai 4
        run: |
          pnpm add -D ai@4.3.19
          pnpm typecheck
          pnpm test
        env:
          DIG_BIN: ${{ runner.temp }}/dig

  python:
    name: python client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"
      - name: Build dig
        run: go build -o "$RUNNER_TEMP/dig" ./cmd/dig
        working-directory: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test against a real dig serve
        run: python -m unittest discover -s tests -v
        env:
          DIG_BIN: ${{ runner.temp }}/dig
